  .legend { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }

  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot-salta { background: #7F77DD; }
  .dot-inkar { background: #1D9E75; }
  .dot-shared { background: #BA7517; }

  .grid { display: flex; flex-direction: column; gap: 10px; }
  .section { border: 1px solid var(--color-border-tertiary); border-radius: 12px; overflow: hidden; }
  .section-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; cursor: pointer; user-select: none; }
  .section-header:hover { background: var(--color-background-secondary); }
  .section-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; }
  .section-meta { font-size: 11px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; }
  .chevron { font-size: 11px; transition: transform 0.2s; color: var(--color-text-tertiary); }

  .section-body { display: none; border-top: 1px solid var(--color-border-tertiary); }

  .file-table { width: 100%; border-collapse: collapse; }
  .file-table th { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-align: left; padding: 7px 14px; background: var(--color-background-secondary); border-bottom: 1px solid var(--color-border-tertiary); }

  .file-table tr:last-child td { border-bottom: none; }
  .file-table tr:hover td { background: var(--color-background-secondary); }
  .path { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-secondary); display: block; margin-top: 2px; }
  .who { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .who-salta { background: #EEEDFE; color: #3C3489; }
  .who-inkar { background: #E1F5EE; color: #085041; }
  .who-shared { background: #FAEEDA; color: #633806; }
  .items { list-style: none; padding: 0; }
  .items li { font-size: 12px; color: var(--color-text-secondary); padding: 2px 0; padding-left: 14px; position: relative; }
  .items li::before { content: "·"; position: absolute; left: 4px; color: var(--color-text-tertiary); }

  .seq-list { padding: 12px 14px; display: flex; flex-direction: column; gap: 0; }
  .seq-item { display: flex; gap: 12px; align-items: flex-start; position: relative; padding-bottom: 16px; }
  .seq-item:last-child { padding-bottom: 0; }
  .seq-item:not(:last-child)::after { content: ''; position: absolute; left: 14px; top: 30px; bottom: 0; width: 1px; background: var(--color-border-tertiary); }
  .seq-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0; z-index: 1; }

  .seq-num.inkar { background: #E1F5EE; color: #085041; }
  .seq-num.shared { background: #FAEEDA; color: #633806; }
  .seq-num.check { background: var(--color-background-success); color: var(--color-text-success); }
  .seq-content { flex: 1; }
  .seq-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
  .seq-desc { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; line-height: 1.5; }

  .folder-tree .dir { color: var(--color-text-primary); font-weight: 500; }
  .folder-tree .salta-f { color: #534AB7; }
  .folder-tree .inkar-f { color: #0F6E56; }

  .stats { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 100px; background: var(--color-background-secondary); border: 1px solid var(--color-border-tertiary); border-radius: 10px; padding: 10px 14px; }
  .stat-num { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
  .stat-label { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .stat-num.salta { color: #534AB7; }
  .stat-num.inkar { color: #0F6E56; }
</style>

function renderSeq() {
  return `<div class="seq-list">${seqSteps.map(s => `
    <div class="seq-item">
      <div class="seq-num ${s.who}" title="${s.who}">
        ${s.who === 'check' ? '✓' : s.who === 'salta' ? 'S' : s.who === 'inkar' ? 'I' : '⊕'}
      </div>
      <div class="seq-content">
        <div class="seq-title">${s.label}</div>
        <div class="seq-desc">${s.desc}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

      <th>Файл</th>
      <th>Поля / Методы</th>
      <th>Кто</th>
    </tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>
        <strong>${r.file}</strong>
        <span class="path">${r.path}${r.file}</span>
      </td>
      <td>
        <ul class="items">${r.items.map(i => `<li>${i}</li>`).join('')}</ul>
      </td>
      <td>${getWhoLabel(r.who)}</td>
    </tr>`).join('')}
    </tbody>
  </table>`;
}

const grid = document.getElementById('grid');

sections.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'section';
  let body = '';
  if (s.type === 'tree') body = renderTree();
  else if (s.type === 'seq') body = renderSeq();
  else if (s.type === 'table') body = renderTable(s.rows);

  const isOpen = i < 2;
  el.innerHTML = `
    <div class="section-header" onclick="toggle(this)">
      <div class="section-title">${s.title}</div>
      <div class="section-meta">
        <span>${s.meta}</span>
        <span class="chevron ${isOpen ? 'open' : ''}">▶</span>
      </div>
    </div>
    <div class="section-body ${isOpen ? 'open' : ''}">${body}</div>
  `;
  grid.appendChild(el);
});

function toggle(header) {
  const body = header.nextElementSibling;
  const chev = header.querySelector('.chevron');
  const open = body.classList.toggle('open');
  chev.classList.toggle('open', open);
}
</script>
